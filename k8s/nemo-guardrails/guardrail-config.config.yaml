# Guardrail LLM: vLLM DIRECTLY, not via OGX. Guardrails sit on top of the
# model server, so the bare served-model-name is used (no vllm-inference-1/
# prefix - that prefix only exists inside Llama Stack's registry).
models:
  - type: main
    engine: openai
    model: redhataiministral-3-3b-instruc
    api_key_env_var: GUARDRAIL_API_KEY
    parameters:
      base_url: "https://redhataiministral-3-3b-instruc-kserve-workload-svc.genai.svc:8000/v1"

streaming: True

rails:
  config:
    # Deterministic Presidio pattern-matching. Does not depend on the LLM,
    # so PII is blocked reliably even if the guardrail model is slow or down.
    sensitive_data_detection:
      input:
        entities:
          - EMAIL_ADDRESS
          - PHONE_NUMBER
          - CREDIT_CARD
          - US_SSN
          - IBAN_CODE
          - IP_ADDRESS
      output:
        entities:
          - EMAIL_ADDRESS
          - PHONE_NUMBER
          - CREDIT_CARD
          - US_SSN
          - IBAN_CODE
  input:
    flows:
      - check blocked terms              # deterministic keyword blocklist
      - detect sensitive data on input   # deterministic PII
      - self check input                 # LLM judge: jailbreak / prompt injection
  output:
    # Required when streaming with output rails: NeMo raises
    # StreamingNotSupportedError unless rails.output.streaming.enabled is True.
    # Rails are then applied to rolling chunks rather than the whole response.
    streaming:
      enabled: True
      chunk_size: 200
      context_size: 50
    flows:
      # Deterministic PII leak prevention only. `self check output` was removed:
      # a 3B judge refused its own benign answers ~2 of 3 times (e.g. "What is
      # the capital of France?" -> "I'm sorry, I can't respond to that."),
      # which makes the assistant unusable. Jailbreak/policy is still enforced
      # on the INPUT side, where the judge is reliable.
      - detect sensitive data on output
