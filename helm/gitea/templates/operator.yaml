apiVersion: v1
kind: Namespace
metadata:
  name: gitea-operator
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "0"
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
---
apiVersion: operators.coreos.com/v1alpha1
kind: CatalogSource
metadata:
  name: redhat-rhpds-gitea
  namespace: gitea-operator
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "1"
spec:
  sourceType: grpc
  image: quay.io/rhpds/gitea-catalog:latest
  displayName: Red Hat Demo Platform (Gitea)
  publisher: Red Hat Demo Platform
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: gitea-operator
  namespace: gitea-operator
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "2"
spec:
  targetNamespaces: []
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: gitea-operator
  namespace: gitea-operator
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "3"
spec:
  channel: stable
  installPlanApproval: Automatic
  name: gitea-operator
  source: redhat-rhpds-gitea
  sourceNamespace: gitea-operator
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-wait-for-crd
  namespace: gitea-operator
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "4"
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  backoffLimit: 30
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ .Release.Name }}-crd-waiter
      containers:
        - name: wait
          image: registry.redhat.io/openshift4/ose-cli:latest
          command:
            - /bin/bash
            - -c
            - |
              echo "Waiting for Gitea CRD to be available..."
              for i in $(seq 1 60); do
                if oc get crd gitea.pfe.rhpds.com >/dev/null 2>&1; then
                  echo "Gitea CRD is ready!"
                  exit 0
                fi
                echo "Attempt $i/60 - CRD not yet available, waiting 10s..."
                sleep 10
              done
              echo "Timed out waiting for Gitea CRD"
              exit 1
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-crd-waiter
  namespace: gitea-operator
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-crd-reader
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": hook-succeeded
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-crd-reader
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": hook-succeeded
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-crd-waiter
    namespace: gitea-operator
roleRef:
  kind: ClusterRole
  name: {{ .Release.Name }}-crd-reader
  apiGroup: rbac.authorization.k8s.io
