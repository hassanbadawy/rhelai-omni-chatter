{{- range $name, $detector := .Values.detectors }}
{{- if and $detector.enabled (eq $detector.type "huggingface") }}
{{- $svcName := printf "%s-detector" ($name | replace "_" "-") }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $svcName }}
  labels:
    app: {{ $svcName }}
    app.kubernetes.io/name: {{ $svcName }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/part-of: trustyai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ $svcName }}
  template:
    metadata:
      labels:
        app: {{ $svcName }}
        app.kubernetes.io/name: {{ $svcName }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/part-of: trustyai
    spec:
      containers:
        - name: {{ $svcName }}
          image: {{ $detector.image | default $.Values.detectorDefaults.image }}
          imagePullPolicy: IfNotPresent
          env:
            - name: DETECTOR_MODEL_ID
              value: {{ $detector.modelId | quote }}
            - name: PORT
              value: "8000"
            {{- if or $detector.hfToken $.Values.detectorDefaults.hfToken }}
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: guardrails-hf-token
                  key: token
            {{- end }}
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          resources:
            {{- toYaml ($detector.resources | default $.Values.detectorDefaults.resources) | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 90
            periodSeconds: 15
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $svcName }}
  labels:
    app: {{ $svcName }}
    app.kubernetes.io/name: {{ $svcName }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
spec:
  selector:
    app: {{ $svcName }}
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
{{- end }}
{{- end }}
