{{- $globalToken := .Values.detectorDefaults.hfToken }}
{{- $anyPerDetectorToken := false }}
{{- range $name, $detector := .Values.detectors }}
  {{- if $detector.hfToken }}{{- $anyPerDetectorToken = true }}{{- end }}
{{- end }}
{{- if or $globalToken $anyPerDetectorToken }}
{{- $token := $globalToken }}
{{- range $name, $detector := .Values.detectors }}
  {{- if $detector.hfToken }}{{- $token = $detector.hfToken }}{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: guardrails-hf-token
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: trustyai
type: Opaque
stringData:
  token: {{ $token | quote }}
{{- end }}
