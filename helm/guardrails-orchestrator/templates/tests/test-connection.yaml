apiVersion: v1
kind: Pod
metadata:
  name: "{{ .Release.Name }}-test-connection"
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: test
      image: registry.access.redhat.com/ubi9/ubi-minimal:latest
      command:
        - /bin/sh
        - -c
        - |
          set -e
          FAIL=0
          {{- range $name, $detector := .Values.detectors }}
          {{- if and $detector.enabled (eq $detector.type "huggingface") }}
          {{- $svcName := printf "%s-detector" ($name | replace "_" "-") }}
          echo "=== Test detector: {{ $name }} ({{ $svcName }}) ==="
          if curl -sf "http://{{ $svcName }}:8000/health" > /dev/null; then
            echo "PASS: {{ $svcName }} /health reachable"
          else
            echo "FAIL: {{ $svcName }} /health not reachable"
            FAIL=1
          fi
          {{- end }}
          {{- end }}

          echo ""
          echo "=== Test orchestrator (TLS) ==="
          if curl -sfk "https://guardrails-orchestrator:8080/health" > /dev/null; then
            echo "PASS: orchestrator /health reachable"
          else
            echo "FAIL: orchestrator /health not reachable"
            FAIL=1
          fi

          if [ $FAIL -eq 0 ]; then
            echo ""
            echo "PASS: all tests passed"
          else
            echo ""
            echo "FAIL: see errors above"
            exit 1
          fi
