# -- Guardrails Orchestrator Configuration
# Single detectors map generates both orchestrator and gateway ConfigMaps automatically.

replicas: 1

# -- Image pull secrets for private registries (e.g. when mirroring registry.redhat.io)
# Applied to orchestrator pod, detector pods, and detector initContainers.
imagePullSecrets: []
#  - name: my-pull-secret

# -- Orchestrator images
images:
  orchestrator: "registry.redhat.io/rhoai/odh-fms-guardrails-orchestrator-rhel9@sha256:c194fea3e7005f3aa8043efeb3a89d036cc46c923c50719b49a7a47d90b1140c"
  gateway: "registry.redhat.io/rhoai/odh-trustyai-vllm-orchestrator-gateway-rhel9@sha256:581d8283d38fe902061d52391da182d74d45d41c543d7df130f1e0e76fa9fd06"
  regexDetector: "registry.redhat.io/rhoai/odh-built-in-detector-rhel9@sha256:0e5c1491e1e31ac6cc993efe78e4a8afa9c2d86635b989eaf4508e18607cf2da"

# -- Orchestrator server config
server:
  port: 8032
  logLevel: info

# -- Resource limits for orchestrator container
resources:
  requests:
    cpu: "1"
    memory: 2Gi
  limits:
    cpu: "1"
    memory: 2Gi

# -- TLS configuration
tls:
  enabled: true
  # -- Use existing secret (must contain tls.crt and tls.key)
  existingSecret: ""
  # -- Auto-generate self-signed cert via OpenShift service serving certs
  autoGenerate: true

# -- OpenShift route (disabled by default — orchestrator is internal only,
# accessed by Llama Stack via https://guardrails-orchestrator:8080)
route:
  enabled: false

# -- Chunker service (for text chunking before detection)
# The orchestrator uses whole_doc_chunker by default — no external chunker needed for content detection.
# Set hostname only if you have a separate chunker service deployed.
chunker:
  hostname: ""
  port: 8085

# -- OpenAI-compatible LLM endpoint (used by gateway for passthrough)
openai:
  hostname: ""
  port: 8080

# -- Default settings applied to all huggingface-type detectors
detectorDefaults:
  image: "quay.io/trustyai/guardrails-detector-huggingface-runtime:latest"
  # -- HuggingFace token for gated models (stored as a Secret, not in plain env vars).
  # Set this globally here, or per-detector via hfToken field.
  # If a per-detector hfToken is set, it takes precedence over this global value.
  # Leave empty for public models (no token needed).
  hfToken: ""
  # -- Optional HuggingFace mirror endpoint (e.g. for air-gapped clusters).
  # Sets HF_ENDPOINT env var on initContainers — they'll fetch models from this
  # URL instead of huggingface.co. Leave empty for default huggingface.co.
  hfEndpoint: ""
  # -- Egress proxy settings. Required when the cluster has an HTTPS egress proxy
  # blocking direct access to huggingface.co. Applied to initContainers.
  proxy:
    httpsProxy: ""
    httpProxy: ""
    noProxy: ".svc,.cluster.local,localhost,127.0.0.1"
  resources:
    requests:
      cpu: "500m"
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi

# -- Detectors configuration
# Each detector entry generates:
#   1. An entry in the orchestrator ConfigMap (hostname, port, threshold)
#   2. An entry in the gateway ConfigMap (input/output, params)
#   3. Inclusion in the "all" route
#
# type: builtin     — regex sidecar in the orchestrator pod (127.0.0.1), no model needed
# type: huggingface — deploys a Deployment+Service in this namespace, pulls model from HuggingFace
#                     Required fields: modelId (HuggingFace model ID, e.g. "org/model-name")
#                     Optional fields: hfToken (per-detector token override), image, resources
# type: remote      — points at an already-running external detector service
#                     Required fields: hostname, port
#
# To add a new detector:
#   my_detector:
#     enabled: true
#     type: huggingface
#     modelId: "org/my-model-name"   # HuggingFace model ID
#     hfToken: "hf_xxx"              # optional — only needed for gated/private models
#     hostname: "my-detector"        # must be a valid DNS label (no underscores)
#     port: 8000
#     threshold: 0.5
#     input: true
#     output: true
#     params: {}
#
detectors:
  regex_competitor:
    enabled: true
    type: builtin
    threshold: 0.5
    input: true
    output: true
    params:
      regex:
        - '(?i).*fight club.*'

  hap:
    enabled: true
    type: huggingface
    modelId: "ibm-granite/granite-guardian-hap-125m"
    hostname: "hap-detector"
    port: 8000
    threshold: 0.5
    input: true
    output: true
    params: {}

  prompt_injection:
    enabled: true
    type: huggingface
    modelId: "protectai/deberta-v3-base-prompt-injection-v2"
    hostname: "prompt-injection-detector"
    port: 8000
    threshold: 0.5
    input: true
    output: false
    params: {}

  language_detection:
    enabled: true
    type: huggingface
    modelId: "papluca/xlm-roberta-base-language-detection"
    hostname: "language-detection-detector"
    port: 8000
    threshold: 0.5
    input: true
    output: true
    params: {}

# -- Custom routes (in addition to auto-generated "all" and "passthrough")
# Each route maps a name to a list of detector names.
customRoutes:
  hap:
    detectors:
      - hap
    fallback_message: "\U0001F482 You know I can't let you ask me that \U0001F482"
