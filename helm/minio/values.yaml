# quay.io/minio/minio and docker.io/minio/minio return 401 anonymously (checked
# 2026-10-15). bitnamilegacy/minio still pulls anonymously (frozen, unmaintained,
# MinIO 2025-05-24 build). Swap to your own mirror/build via `image` + pull secret.
image: docker.io/bitnamilegacy/minio:latest
# IfNotPresent: a node that already has the image keeps working when the
# registry is unreachable or starts requiring auth (quay.io/minio/minio now
# returns 401 anonymously, so `Always` + `:latest` leaves the pod in
# ImagePullBackOff after any restart).
imagePullPolicy: IfNotPresent
# Pull secrets for a private registry, e.g. [{name: my-pull-secret}]
imagePullSecrets: []
# Override the container start command / arguments. Needed for images whose
# entrypoint is not the upstream `minio` binary (leave empty for upstream).
command:
  - minio
# Leave empty to get `server /data --console-address :<consolePort>`.
args: []
storage: 20Gi

rootUser: minio
rootPassword: minio123

apiPort: 9000
consolePort: 9090

route:
  api:
    enabled: true
  console:
    enabled: true

resources:
  requests:
    cpu: 20m
    memory: 100Mi
  limits:
    cpu: 250m
    memory: 1Gi
