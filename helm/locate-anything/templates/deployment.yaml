apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "locate-anything.fullname" . }}
  labels:
    {{- include "locate-anything.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "locate-anything.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "locate-anything.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: nim
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            {{- if .Values.ngcApiKey }}
            - name: NGC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "locate-anything.fullname" . }}-ngc
                  key: NGC_API_KEY
            {{- end }}
            - name: NIM_CACHE_PATH
              value: /opt/nim/.cache
            {{- range $key, $val := .Values.extraEnv }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /v1/health/ready
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /v1/health/live
              port: http
            initialDelaySeconds: 120
            periodSeconds: 20
            failureThreshold: 5
          volumeMounts:
            - name: nim-cache
              mountPath: /opt/nim/.cache
      volumes:
        - name: nim-cache
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "locate-anything.fullname" . }}-cache
          {{- else }}
          emptyDir: {}
          {{- end }}
