{{- if and .Values.rbac.create .Values.serviceAccount.name }}
{{- if eq .Values.rbac.scope "cluster" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-{{ .Values.serviceAccount.name }}-{{ .Values.rbac.clusterRole }}
  labels:
    {{- include "mcp-server-prereqs.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.rbac.clusterRole }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
{{- else if eq .Values.rbac.scope "namespace" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.serviceAccount.name }}-{{ .Values.rbac.clusterRole }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mcp-server-prereqs.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.rbac.clusterRole }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
{{- else }}
{{- fail "rbac.scope must be 'namespace' or 'cluster'" }}
{{- end }}
{{- end }}
