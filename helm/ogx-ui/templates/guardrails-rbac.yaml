{{- if and .Values.guardrails.url .Values.guardrails.rbac.create }}
{{- $ns := .Values.guardrails.namespace | default .Release.Namespace }}
# The guardrails endpoint is fronted by kube-rbac-proxy, whose config.yaml
# authorizes callers via:
#   resourceAttributes: {resource: services, resourceName: <svc>, verb: get}
# so the UI's ServiceAccount needs exactly that permission -- nothing more.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ogx-ui.fullname" . }}-guardrails
  namespace: {{ $ns }}
  labels:
    {{- include "ogx-ui.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["services"]
    resourceNames: [{{ .Values.guardrails.serviceName | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ogx-ui.fullname" . }}-guardrails
  namespace: {{ $ns }}
  labels:
    {{- include "ogx-ui.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ogx-ui.fullname" . }}-guardrails
subjects:
  - kind: ServiceAccount
    name: {{ include "ogx-ui.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
