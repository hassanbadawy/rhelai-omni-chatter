{{- if .Values.litellm.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "litemaas.litellm.fullname" . }}
  labels:
    {{- include "litemaas.componentLabels" (dict "context" . "component" "ai-proxy") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "litemaas.componentSelectorLabels" (dict "context" . "component" "ai-proxy") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "litemaas.componentLabels" (dict "context" . "component" "ai-proxy") | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "litemaas.serviceAccountName" . }}
      initContainers:
        {{- include "litemaas.initWaitForDatabase" (dict "context" . "secretName" (include "litemaas.litellm.secretName" .) "secretKey" "database-url") | nindent 8 }}
        {{- if eq .Values.global.platform "openshift" }}
        - name: build-ca-bundle
          image: "{{ .Values.litellm.image.repository }}:{{ .Values.litellm.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - sh
            - -c
            - |
              set -eu
              for f in /etc/pki/tls/certs/ca-bundle.crt /etc/ssl/certs/ca-certificates.crt /etc/ssl/cert.pem; do
                if [ -f "$f" ]; then
                  cp "$f" /combined/ca-bundle.crt
                  echo "Seeded combined CA from $f"
                  break
                fi
              done
              if [ -f /ocp/service-ca.crt ]; then
                cat /ocp/service-ca.crt >> /combined/ca-bundle.crt
                echo "Appended OpenShift service-ca.crt"
              else
                echo "WARN: /ocp/service-ca.crt not found"
              fi
              wc -l /combined/ca-bundle.crt
          volumeMounts:
            - name: ocp-ca-bundle
              mountPath: /ocp
              readOnly: true
            - name: combined-ca-bundle
              mountPath: /combined
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"
        {{- end }}
      containers:
        - name: litellm
          image: "{{ .Values.litellm.image.repository }}:{{ .Values.litellm.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 4000
              name: http
          env:
            # Database Configuration
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "litemaas.litellm.secretName" . }}
                  key: database-url
            # LiteLLM Configuration
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "litemaas.litellm.secretName" . }}
                  key: master-key
            - name: UI_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "litemaas.litellm.secretName" . }}
                  key: ui-username
            - name: UI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "litemaas.litellm.secretName" . }}
                  key: ui-password
            {{- if eq .Values.global.platform "openshift" }}
            # Trust OpenShift service-ca for in-cluster HTTPS (e.g. KServe predictors on :8443)
            - name: SSL_CERT_FILE
              value: /etc/litellm/ca/ca-bundle.crt
            - name: REQUESTS_CA_BUNDLE
              value: /etc/litellm/ca/ca-bundle.crt
            {{- end }}
            # Application Configuration
            - name: LITELLM_MODE
              value: "PRODUCTION"
            - name: STORE_MODEL_IN_DB
              value: "True"
            - name: DISABLE_SCHEMA_UPDATE
              value: "false"
            {{- $redisHost := include "litemaas.redis.host" . }}
            {{- if $redisHost }}
            - name: REDIS_HOST
              value: {{ $redisHost | quote }}
            - name: REDIS_PORT
              value: {{ .Values.backend.redis.port | quote }}
            {{- end }}
            {{- if .Values.litellm.sso.enabled }}
            # SSO Configuration
            - name: PROXY_BASE_URL
              value: {{ include "litemaas.litellm.url" . | quote }}
            - name: GENERIC_CLIENT_ID
              value: {{ include "litemaas.oauth.clientId" . | quote }}
            - name: GENERIC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  {{- if eq .Values.oauth.mode "serviceaccount" }}
                  name: {{ include "litemaas.oauth.tokenSecretName" . }}
                  key: token
                  {{- else }}
                  name: {{ include "litemaas.backend.secretName" . }}
                  key: oauth-client-secret
                  {{- end }}
            - name: GENERIC_AUTHORIZATION_ENDPOINT
              value: {{ include "litemaas.litellm.sso.authorizationEndpoint" . | quote }}
            - name: GENERIC_TOKEN_ENDPOINT
              value: {{ include "litemaas.litellm.sso.tokenEndpoint" . | quote }}
            - name: GENERIC_USERINFO_ENDPOINT
              value: {{ include "litemaas.litellm.sso.userinfoEndpoint" . | quote }}
            - name: GENERIC_SCOPE
              value: {{ include "litemaas.litellm.sso.scope" . | quote }}
            {{- if .Values.litellm.sso.adminId }}
            - name: PROXY_ADMIN_ID
              value: {{ .Values.litellm.sso.adminId | quote }}
            {{- end }}
            {{- end }}
          {{- if eq .Values.global.platform "openshift" }}
          volumeMounts:
            - name: combined-ca-bundle
              mountPath: /etc/litellm/ca
              readOnly: true
          {{- end }}
          resources:
            {{- toYaml .Values.litellm.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 4000
            initialDelaySeconds: {{ .Values.litellm.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.litellm.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.litellm.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.litellm.livenessProbe.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 4000
            initialDelaySeconds: {{ .Values.litellm.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.litellm.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.litellm.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.litellm.readinessProbe.failureThreshold }}
      {{- if eq .Values.global.platform "openshift" }}
      volumes:
        - name: ocp-ca-bundle
          configMap:
            name: {{ include "litemaas.litellm.fullname" . }}-ca-bundle
        - name: combined-ca-bundle
          emptyDir: {}
      {{- end }}
{{- end }}
