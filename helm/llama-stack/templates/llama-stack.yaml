apiVersion: v1
kind: ConfigMap
metadata:
  name: llama-stack-config
  labels:
    llamastack.io/distribution: llama-stack
    opendatahub.io/dashboard: "true"
data:
  config.yaml: |
{{- if .Values.guardrails.enabled }}
    # -----------------------------------------------------------------------
    # GUARDRAILS MODE — legacy 0.3.x schema, requires custom image
    # (quay.io/rhoai-genaiops/llama-stack-vllm-milvus-fms)
    # -----------------------------------------------------------------------
    version: '2'
    image_name: vllm
    apis:
    - agents
    - datasetio
    - eval
    - files
    - inference
    - safety
    - shields
    - scoring
    - tool_runtime
    - vector_io
    providers:
      safety:
      - provider_id: trusty_fms
        provider_type: remote::trusty_fms
        config:
          orchestrator_url: {{ .Values.guardrails.orchestratorUrl }}
          verify_ssl: false
          {{- if or .Values.guardrails.regex.enabled .Values.guardrails.hap.enabled .Values.guardrails.prompt_injection.enabled .Values.guardrails.language_detection.enabled }}
          shields:
            {{- if .Values.guardrails.regex.enabled }}
            regex:
              detectors:
                regex_competitor:
                  detector_params:
                    regex: [{{- range $i, $f := .Values.guardrails.regex.filter }}{{ if $i }}, {{ end }}{{ $f | quote }}{{- end }}]
              type: content
              confidence_threshold: {{ .Values.guardrails.regex.confidence_threshold }}
              message_types: ["user", "system", "completion"]
            {{- end }}
            {{- if .Values.guardrails.hap.enabled }}
            hap:
              type: content
              confidence_threshold: {{ .Values.guardrails.hap.confidence_threshold }}
              message_types: ["user", "system", "completion"]
              detectors:
                hap:
                  detector_params: {}
            {{- end }}
            {{- if .Values.guardrails.language_detection.enabled }}
            language_detection:
              type: content
              confidence_threshold: {{ .Values.guardrails.language_detection.confidence_threshold }}
              message_types: ["user", "system", "completion"]
              detectors:
                language_detection:
                  detector_params: {}
            {{- end }}
            {{- if .Values.guardrails.prompt_injection.enabled }}
            prompt_injection:
              type: content
              confidence_threshold: {{ .Values.guardrails.prompt_injection.confidence_threshold }}
              message_types: ["user", "system", "completion"]
              detectors:
                prompt_injection:
                  detector_params: {}
            {{- end }}
          {{- end }}
      inference:
      - provider_id: sentence-transformers
        provider_type: inline::sentence-transformers
        config: {}
      - provider_id: vllm
        provider_type: remote::vllm
        config:
          url: {{ .Values.vllm.url }}
          {{- if .Values.vllm.apiToken }}
          api_token: {{ .Values.vllm.apiToken }}
          {{- end }}
          tls_verify: {{ .Values.vllm.tlsVerify }}
      agents:
      - provider_id: meta-reference
        provider_type: inline::meta-reference
        config:
          persistence_store:
            type: sqlite
            db_path: /opt/app-root/src/.llama/distributions/rh/agents_store.db
          responses_store:
            type: sqlite
            db_path: /opt/app-root/src/.llama/distributions/rh/responses_store.db
      eval:
      - provider_id: meta-reference
        provider_type: inline::meta-reference
        config:
          kvstore:
            type: sqlite
            namespace: null
            db_path: /opt/app-root/src/.llama/distributions/rh/eval_store.db
      datasetio:
      - provider_id: huggingface
        provider_type: remote::huggingface
        config:
          kvstore:
            type: sqlite
            namespace: null
            db_path: /opt/app-root/src/.llama/distributions/rh/huggingface_datasetio.db
      files:
      - provider_id: local-files
        provider_type: inline::localfs
        config:
          storage_dir: /opt/app-root/src/.llama/distributions/rh/files
          create_if_missing: true
          metadata_store:
            type: sqlite
            db_path: /opt/app-root/src/.llama/distributions/rh/files_metadata.db
      scoring:
      - provider_id: basic
        provider_type: inline::basic
        config: {}
      - provider_id: llm-as-judge
        provider_type: inline::llm-as-judge
        config: {}
      tool_runtime:
      - provider_id: rag-runtime
        provider_type: inline::rag-runtime
        config: {}
      - provider_id: model-context-protocol
        provider_type: remote::model-context-protocol
        config: {}
      vector_io:
      - provider_id: milvus
        {{- if eq .Values.milvus.mode "remote" }}
        provider_type: remote::milvus
        config:
          uri: {{ .Values.milvus.endpoint }}
          token: {{ .Values.milvus.token | default "root:Milvus" | quote }}
          kvstore:
            type: sqlite
            db_path: ${env.SQLITE_STORE_DIR:={{ .Values.configDir }}}/milvus_registry.db
        {{- else }}
        provider_type: inline::milvus
        config:
          db_path: ${env.MILVUS_DB_PATH:={{ .Values.configDir }}}/milvus.db
          kvstore:
            type: sqlite
            db_path: ${env.SQLITE_STORE_DIR:={{ .Values.configDir }}}/milvus_registry.db
        {{- end }}
    models:
    - provider_id: vllm
      model_id: {{ .Values.vllm.modelId }}
      provider_model_id: {{ .Values.vllm.modelId }}
      model_type: llm
    - provider_id: sentence-transformers
      model_id: {{ .Values.embedding.providerModelId }}
      provider_model_id: {{ .Values.embedding.providerModelId }}
      model_type: embedding
      metadata:
        embedding_dimension: {{ .Values.embedding.dimension }}
    external_providers_dir: /opt/app-root/src/.llama/providers.d/
    shields:
    {{- $shieldsEmpty := true }}
    {{- if .Values.guardrails.regex.enabled }}{{- $shieldsEmpty = false }}
    - shield_id: regex
      provider_id: trusty_fms
    {{- end }}
    {{- if .Values.guardrails.hap.enabled }}{{- $shieldsEmpty = false }}
    - shield_id: hap
      provider_id: trusty_fms
    {{- end }}
    {{- if .Values.guardrails.prompt_injection.enabled }}{{- $shieldsEmpty = false }}
    - shield_id: prompt_injection
      provider_id: trusty_fms
    {{- end }}
    {{- if .Values.guardrails.language_detection.enabled }}{{- $shieldsEmpty = false }}
    - shield_id: language_detection
      provider_id: trusty_fms
    {{- end }}
    {{- if $shieldsEmpty }} []{{- end }}
    tool_groups:
    - toolgroup_id: builtin::rag
      provider_id: rag-runtime
    server:
      port: {{ .Values.port }}
{{- else }}
    # -----------------------------------------------------------------------
    # STANDARD MODE — LlamaStack 0.7.x schema (rh distribution)
    # Compatible with RHOAI 3.4+ and AutoRAG (Gen AI Studio)
    # -----------------------------------------------------------------------
    version: "2"
    distro_name: rh
    apis:
    - responses
    - datasetio
    - files
    - inference
    - safety
    - scoring
    - tool_runtime
    - vector_io
    providers:
      inference:
      - provider_id: sentence-transformers
        provider_type: inline::sentence-transformers
        config: {}
      - provider_id: vllm
        provider_type: remote::vllm
        config:
          base_url: {{ .Values.vllm.url }}
          api_token: {{ .Values.vllm.apiToken }}
          tls_verify: {{ .Values.vllm.tlsVerify }}
          max_tokens: {{ .Values.vllm.maxTokens }}
      vector_io:
      - provider_id: milvus
        {{- if eq .Values.milvus.mode "remote" }}
        provider_type: remote::milvus
        config:
          uri: {{ .Values.milvus.endpoint }}
          token: "${env.MILVUS_TOKEN:=}"
          consistency_level: Strong
          persistence:
            backend: kv_default
            namespace: "vector_io::milvus"
        {{- else }}
        provider_type: inline::milvus
        config:
          db_path: {{ .Values.configDir }}/milvus.db
          persistence:
            backend: kv_default
            namespace: "vector_io::milvus"
        {{- end }}
      responses:
      - provider_id: builtin
        provider_type: inline::builtin
        config:
          persistence:
            agent_state:
              backend: kv_default
              namespace: agents
            responses:
              backend: sql_default
              max_write_queue_size: 10000
              num_writers: 4
              table_name: responses
      eval: []
      files:
      - provider_id: meta-reference-files
        provider_type: inline::localfs
        config:
          metadata_store:
            backend: sql_default
            table_name: files_metadata
          storage_dir: {{ .Values.configDir }}/files
      datasetio:
      - provider_id: huggingface
        provider_type: remote::huggingface
        config:
          kvstore:
            backend: kv_default
            namespace: datasetio::huggingface
      scoring:
      - provider_id: basic
        provider_type: inline::basic
        config: {}
      - provider_id: llm-as-judge
        provider_type: inline::llm-as-judge
        config: {}
      tool_runtime:
      - provider_id: file-search
        provider_type: inline::file-search
        config: {}
      - provider_id: model-context-protocol
        provider_type: remote::model-context-protocol
        config: {}
      safety: []
    metadata_store:
      type: sqlite
      db_path: {{ .Values.configDir }}/inference_store.db
    storage:
      backends:
        kv_default:
          type: kv_sqlite
          db_path: {{ .Values.configDir }}/kvstore.db
        sql_default:
          type: sql_sqlite
          db_path: {{ .Values.configDir }}/sql_store.db
      stores:
        conversations:
          backend: sql_default
          table_name: openai_conversations
        inference:
          backend: sql_default
          table_name: inference_store
        metadata:
          backend: kv_default
          namespace: registry
    vector_stores:
      default_provider_id: milvus
      default_embedding_model:
        provider_id: sentence-transformers
        model_id: {{ .Values.embedding.providerModelId }}
    registered_resources:
      models:
      - provider_id: sentence-transformers
        model_id: {{ .Values.embedding.providerModelId }}
        provider_model_id: {{ .Values.embedding.providerModelId }}
        model_type: embedding
        metadata:
          embedding_dimension: {{ .Values.embedding.dimension }}
      - provider_id: vllm
        model_id: {{ .Values.vllm.modelId }}
        model_type: llm
        metadata:
          display_name: {{ .Values.vllm.modelId }}
      shields: []
      vector_stores: []
      datasets: []
      scoring_fns: []
      benchmarks: []
      tool_groups: []
    server:
      port: {{ .Values.port }}
    telemetry:
      enabled: false
{{- end }}
---
apiVersion: llamastack.io/v1alpha1
kind: LlamaStackDistribution
metadata:
  name: llama-stack
spec:
  replicas: {{ .Values.replicas }}
  server:
    distribution:
      {{- if and .Values.guardrails.enabled .Values.image }}
      image: {{ .Values.image | quote }}
      {{- else }}
      name: {{ .Values.distribution }}
      {{- end }}
    userConfig:
      configMapName: llama-stack-config
    containerSpec:
      command:
        - /bin/sh
        - "-c"
        - llama stack run /etc/llama-stack/config.yaml
      port: {{ .Values.port }}
      env:
        - name: VLLM_URL
          value: {{ .Values.vllm.url | quote }}
        - name: VLLM_API_TOKEN
          value: {{ .Values.vllm.apiToken | quote }}
        - name: VLLM_TLS_VERIFY
          value: {{ .Values.vllm.tlsVerify | quote }}
        - name: VLLM_MAX_TOKENS
          value: {{ .Values.vllm.maxTokens | quote }}
        - name: LLAMA_STACK_CONFIG_DIR
          value: {{ .Values.configDir }}
        {{- if and (eq .Values.milvus.mode "remote") .Values.milvus.secretName }}
        - name: MILVUS_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.milvus.secretName }}
              key: {{ .Values.milvus.secretKey | default "root-password" }}
        - name: MILVUS_TOKEN
          value: "root:$(MILVUS_ROOT_PASSWORD)"
        {{- end }}
        {{- if .Values.guardrails.enabled }}
        - name: FMS_VERIFY_SSL
          value: "false"
        - name: MILVUS_DB_PATH
          value: /opt/app-root/src/.llama/distributions/rh
        - name: SQLITE_STORE_DIR
          value: /opt/app-root/src/.llama/distributions/rh
        {{- end }}
      resources:
        {{- toYaml .Values.resources | nindent 8 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: llama-stack-allow-ingress
spec:
  podSelector:
    matchLabels:
      app: llama-stack
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
        - podSelector: {}
      ports:
        - port: {{ .Values.port }}
          protocol: TCP
  policyTypes:
    - Ingress
{{- if .Values.route.enabled }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: llama-stack
  labels:
    app: llama-stack
spec:
  to:
    kind: Service
    name: llama-stack-service
  port:
    targetPort: {{ .Values.port }}
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
{{- end }}
{{- if .Values.autorag.connectionSecret.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: llama-stack-connection
  annotations:
    openshift.io/display-name: LlamaStack AutoRAG
  labels:
    opendatahub.io/dashboard: "true"
type: Opaque
stringData:
  LLAMA_STACK_CLIENT_BASE_URL: {{ .Values.autorag.connectionSecret.llamaStackUrl | quote }}
  LLAMA_STACK_CLIENT_API_KEY: "unused"
  OGX_CLIENT_BASE_URL: {{ .Values.autorag.connectionSecret.llamaStackUrl | quote }}
  OGX_CLIENT_API_KEY: "unused"
{{- end }}
{{- if .Values.autorag.vectorStores.enabled }}
---
# gen-ai-aa-vector-stores ConfigMap — required by the RHOAI Gen AI Studio AutoRAG BFF.
# The BFF reads the "Vector I/O provider" dropdown exclusively from this ConfigMap.
# It does NOT query LlamaStack's /v1/vector_stores endpoint for this data.
#
# Step 1: deploy LlamaStack (this chart), wait for it to come up.
# Step 2: retrieve the auto-created vector_store_id:
#   oc exec deploy/<lsd-name> -- curl -s http://localhost:8321/v1/vector_stores \
#     | jq -r '.data[0].identifier'
# Step 3: set autorag.vectorStores.milvusVectorStoreId and re-deploy.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gen-ai-aa-vector-stores
  labels:
    opendatahub.io/dashboard: "true"
data:
  config.yaml: |
    providers:
      vector_io:
        - provider_id: milvus
          provider_type: remote::milvus
          config:
            uri: {{ .Values.milvus.endpoint }}
            custom_gen_ai:
              credentials:
                secretRefs:
                  - name: {{ .Values.milvus.secretName }}
                    key: {{ .Values.milvus.secretKey | default "root-password" }}
    registered_resources:
      vector_stores:
{{- if .Values.autorag.vectorStores.milvusVectorStoreId }}
        - provider_id: milvus
          vector_store_id: {{ .Values.autorag.vectorStores.milvusVectorStoreId | quote }}
          embedding_model: {{ .Values.embedding.providerModelId }}
          embedding_dimension: {{ .Values.embedding.dimension }}
          vector_store_name: {{ .Values.autorag.vectorStores.vectorStoreName | quote }}
          metadata:
            description: "Milvus vector store managed by llama-stack Helm chart"
{{- else }}
        []
{{- end }}
{{- end }}
