distribution: rh-dev

# -- Custom image with trusty_fms safety provider (used when guardrails.enabled=true).
# This is a third-party image. If the cluster cannot pull from quay.io/rhoai-genaiops,
# mirror this image to a private registry and override the value here.
# The standard mode (guardrails.enabled=false) uses the rh-dev image bundled
# with the RHOAI Llama Stack operator and does not need a custom image.
image: "quay.io/rhoai-genaiops/llama-stack-vllm-milvus-fms:rhoai-3.0-fix3"
replicas: 1
port: 8321

vllm:
  url: "http://tinyllamatinyllama-11b-chat-v06-predictor.genai-demo.svc.cluster.local:8080/v1"
  apiToken: "fake"
  tlsVerify: "false"
  maxTokens: "4096"
  # modelId is registered as a plain short ID — no provider prefix.
  # Must match the identifier vLLM reports at GET /v1/models WITHOUT the provider prefix.
  modelId: "meta-llama/Llama-3.2-3B-Instruct"

configDir: /opt/app-root/src/.llama/distributions/rh

route:
  enabled: true

resources:
  requests:
    cpu: "250m"
    memory: "500Mi"
  limits:
    cpu: "4"
    memory: "12Gi"

embedding:
  # providerModelId is the HuggingFace model path used by sentence-transformers.
  # modelId is derived from providerModelId (they must match in 0.7.x schema)
  # so that vector_stores.default_embedding_model lookup resolves correctly.
  providerModelId: ibm-granite/granite-embedding-125m-english
  dimension: 768

# -- Guardrails (requires guardrails-orchestrator deployed in same namespace)
guardrails:
  enabled: false
  orchestratorUrl: "https://guardrails-orchestrator:8080"
  regex:
    enabled: false
    filter: ["(?i).*fight club.*"]
    confidence_threshold: 0.5
  hap:
    enabled: false
    confidence_threshold: 0.5
  prompt_injection:
    enabled: false
    confidence_threshold: 0.5
  language_detection:
    enabled: false
    confidence_threshold: 0.85

# -- Milvus vector database
# mode: "inline" (embedded, no external service needed)
#       "remote" (connect to a standalone Milvus instance — required for AutoRAG)
milvus:
  mode: "remote"
  # Short service name — works when Milvus is installed in the same namespace.
  # No namespace suffix needed; Kubernetes resolves within the same project.
  endpoint: "http://milvus:19530"
  # Leave token empty to rely on secretName/secretKey injection (recommended).
  # Set token directly only for dev/testing without a secret.
  token: ""
  # Secret holding the Milvus root password. Set to "" to skip secret injection.
  secretName: "milvus-secret"
  secretKey: "root-password"

# -- AutoRAG connection secret and vector store ConfigMap
# Enables resources that RHOAI Gen AI Studio AutoRAG UI needs to connect to LlamaStack.
autorag:
  connectionSecret:
    enabled: true
    # Must be a fully-qualified service name (FQDN) — the gen-ai-ui BFF container
    # does not have the target namespace in its DNS search path, so short service
    # names fail. Format: http://<svc-name>.<namespace>.svc.cluster.local:<port>
    llamaStackUrl: "http://llama-stack-service.default.svc.cluster.local:8321"

  # gen-ai-aa-vector-stores ConfigMap — required by the AutoRAG BFF for the
  # "Vector I/O provider" dropdown. The BFF reads ONLY this ConfigMap; it does
  # NOT fall back to LlamaStack's /v1/vector_stores endpoint.
  vectorStores:
    enabled: true
    # vector_store_id is auto-created by LlamaStack on first Milvus connection.
    # After first deploy, retrieve it with:
    #   oc exec deploy/<lsd-name> -- curl -s http://localhost:8321/v1/vector_stores \
    #     | jq -r '.data[0].identifier'
    # Then set this value and re-deploy.
    milvusVectorStoreId: ""
    vectorStoreName: "Milvus"
